name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build, verify & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify, test & build
        run: npm run all

      - name: Ensure committed dist/ matches the build
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::Tagged commit ships a stale dist/. Rebuild and re-tag."
            git --no-pager diff -- dist/
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES_FLAG="--generate-notes"
          if grep -q "## \[${TAG#v}\]" CHANGELOG.md; then
            # Extract this version's section from the changelog as release notes.
            awk -v ver="## \\[${TAG#v}\\]" '
              $0 ~ ver {capture=1; next}
              /^## \[/ && capture {exit}
              capture {print}
            ' CHANGELOG.md > /tmp/notes.md
            if [ -s /tmp/notes.md ]; then NOTES_FLAG="--notes-file /tmp/notes.md"; fi
          fi
          gh release create "$TAG" --title "$TAG" --verify-tag $NOTES_FLAG

      - name: Move major version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          MAJOR="${TAG%%.*}" # v1.2.3 -> v1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$TAG"
          git push origin "$MAJOR" --force
